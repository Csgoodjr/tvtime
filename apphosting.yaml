# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 100
  concurrency: 80

env:
  # The TMDB v3 API Read Access Token, kept server-side only (see
  # src/server/tmdb.ts). Set its value with:
  #   firebase apphosting:secrets:set TMDB_READ_TOKEN
  - variable: TMDB_READ_TOKEN
    secret: TMDB_READ_TOKEN
    availability:
      - RUNTIME
