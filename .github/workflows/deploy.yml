name: Deploy

on:
  push:
    branches:
      - master

env:
  NODE_VERSION: 22

jobs:
  deploy:
    name: Deploy to Firebase App Hosting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npx firebase-tools@latest deploy --only apphosting --project tvtime-d058b --non-interactive
